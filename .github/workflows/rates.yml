name: Bake country exchange rates

on:
  schedule:
    - cron: '7,37 * * * *'  # every ~30 min (GitHub may delay scheduled runs)
  workflow_dispatch:

concurrency:
  group: bake-rates
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build-ai.mjs reads git history for last_updated
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - name: Fetch rates, pre-render HTML and rebuild AI layer
        run: node scripts/bake-rates.mjs
      - name: Bake rates RSS feed
        run: node scripts/bake-feed.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(rates): bake latest exchange rates"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done; exit 1
