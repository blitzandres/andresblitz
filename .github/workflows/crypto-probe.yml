name: Crypto source probe
# Tries every /dolar-cripto/ source (CriptoYa, Binance P2P, Yadio, CoinGecko) from a GitHub runner; writes nothing.
on:
  pull_request:
    paths: [scripts/bake-crypto.mjs]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/bake-crypto.mjs --probe
