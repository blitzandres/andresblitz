name: Update Analytics Data

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  update-analytics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub Traffic - Views
        run: |
          curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/blitzandres/andresblitz/traffic/views \
            > dashboard/data/views.json

      - name: Fetch GitHub Traffic - Referrers
        run: |
          curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/blitzandres/andresblitz/traffic/referrers \
            > dashboard/data/referrers.json

      - name: Fetch GitHub Traffic - Popular Paths
        run: |
          curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/blitzandres/andresblitz/traffic/popular/paths \
            > dashboard/data/paths.json

      - name: Fetch Repo Stats
        run: |
          curl -s \
            https://api.github.com/repos/blitzandres/andresblitz \
            > dashboard/data/repo.json
          echo "{\"updated\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            > dashboard/data/last-updated.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/
          git diff --staged --quiet || git commit -m "chore: update analytics data [skip ci]"
          git push
