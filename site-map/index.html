<script>
(function () {
  // Sections: how pages are grouped. Order = order in the tree.
  var SECTIONS = [
    { id: 'projects', name: 'Projects', color: '#5b8def', url: '/projects/', test: function (s) { return s.indexOf('projects') === 0; } },
    { id: 'dolar', name: 'Dólar hoy', group: 'latam', color: '#34d399', test: function (s) { return s === 'tasa-bcv' || s.indexOf('dolar-') === 0; } },
    { id: 'calc', name: 'Calculadoras', group: 'latam', color: '#fbbf24', test: function (s) { return /^(enviar-dinero|salario-en-dolares|convertidor-cripto|comision-cripto|ahorro-en-dolares)$/.test(s); } },
    { id: 'guias', name: 'Guías cripto', group: 'latam', color: '#a78bfa', url: '/guias-cripto/', test: function (s) { return s.indexOf('guias-cripto') === 0; } },
    { id: 'markets', name: 'Bitcoin', color: '#f472b6', test: function (s) { return s === 'bitcoin'; } },
    { id: 'el70', name: 'El 70', color: '#f87171', test: function (s) { return s === '70'; } }
  ];
  // Groups wrap several sections under one branch.
  var GROUPS = { latam: { name: 'Latinoamérica', color: '#2dd4bf' } };

  // Labels where the page title reads badly in a tree.
  var LABELS = { 'projects-blitzys-world-play': 'Play (full screen)', 'projects-blitzys-world-play-3d': '3D levels' };

  // "Name — tagline | Andrés Blitz" -> "Name"
  function short(t) {
    t = t.replace(/\s*\|\s*Andr[ée]s Blitz.*$/, '');
    var cut = t.split(/\s[—–]\s|:\s|\s\|\s/)[0];
    return cut.length > 38 ? cut.slice(0, 36) + '…' : cut;
  }
  function pathOf(url) { try { return new URL(url).pathname; } catch (e) { return url; } }

  function build(pages) {
    var bySlug = {};
    pages.forEach(function (p) { bySlug[p.slug] = p; });
    var home = bySlug.home || { title: 'andresblitz.com', url: '/', summary: '' };
    var groups = {};
    var root = { id: 'root', name: 'andresblitz.com', page: home, color: '#e7ecf5', children: [] };

    SECTIONS.forEach(function (sec) {
      var list = pages.filter(function (p) { return p.slug !== 'home' && sec.test(p.slug); });
      if (!list.length) return;
      // A section's own index page (e.g. /projects/) becomes the section node.
      var indexPage = list.filter(function (p) { return sec.url && pathOf(p.url) === sec.url; })[0];
      // A one-page section (Bitcoin, El 70) is shown as a single top-level page.
      if (list.length === 1 && !sec.url) {
        root.children.push({ id: list[0].slug, name: sec.name, color: sec.color, page: list[0] });
        return;
      }
      var node = { id: sec.id, name: sec.name, color: sec.color, page: indexPage, children: [] };
      var nodes = {};
      list.filter(function (p) { return p !== indexPage; })
        .sort(function (a, b) { return pathOf(a.url).localeCompare(pathOf(b.url)); })
        .forEach(function (p) {
          var path = pathOf(p.url);
          var parent = path.replace(/[^/]+\/$/, '');
          var name = LABELS[p.slug] || short(p.title);
          var n = { id: p.slug, name: name, color: sec.color, page: p, path: path };
          nodes[path] = n;
          // Nest sub-pages (e.g. /play/3d/) under their parent page.
          (nodes[parent] ? (nodes[parent].children = nodes[parent].children || []) : node.children).push(n);
        });
      if (sec.group) {
        var g = groups[sec.group];
        if (!g) {
          g = groups[sec.group] = { id: sec.group, name: GROUPS[sec.group].name, color: GROUPS[sec.group].color, children: [] };
          root.children.push(g);
        }
        g.children.push(node);
      } else {
        root.children.push(node);
      }
    });
    return root;
  }

  var svg = document.getElementById('tree');
  var NS = 'http://www.w3.org/2000/svg';
  var DX = 26, DY = window.innerWidth < 640 ? 150 : 210, PAD = 24;
  var root, sel = null, query = '';

  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function esc(s) { return String(s || ''); }

  function collapse(d) { if (d.children) { d._children = d.children; d._children.forEach(collapse); d.children = null; } }
  function expand(d) { if (d._children) { d.children = d._children; d._children = null; } (d.children || []).forEach(expand); }

  var gLinks, gNodes, nodeEls = {};

  function render() {
    d3.tree().nodeSize([DX, DY])(root);
    var x0 = Infinity, x1 = -Infinity, y1 = 0;
    root.each(function (d) { if (d.x < x0) x0 = d.x; if (d.x > x1) x1 = d.x; if (d.y > y1) y1 = d.y; });
    var w = y1 + DY + PAD * 2 + 60, h = x1 - x0 + PAD * 2 + 20;
    svg.setAttribute('width', w); svg.setAttribute('height', h);
    svg.setAttribute('viewBox', [-PAD - 10, x0 - PAD - 10, w, h].join(' '));

    gLinks.textContent = '';
    root.links().forEach(function (l) {
      var s = l.source, t = l.target, mx = (s.y + t.y) / 2;
      el('path', { 'class': 'link' + (dimmed(t) ? ' dim' : ''), stroke: t.data.color,
        d: 'M' + s.y + ',' + s.x + 'C' + mx + ',' + s.x + ' ' + mx + ',' + t.x + ' ' + t.y + ',' + t.x }, gLinks);
    });

    var live = {};
    root.descendants().forEach(function (d) {
      var key = d.data.id; live[key] = true;
      var g = nodeEls[key];
      var hasKids = d.children || d._children;
      if (!g) {
        g = el('g', { tabindex: 0, role: 'button' }, gNodes);
        g.style.transform = 'translate(' + (d.parent ? d.parent.y : 0) + 'px,' + (d.parent ? d.parent.x : 0) + 'px)';
        el('circle', { r: 6 }, g);
        var t = el('text', { dy: '0.32em' }, g);
        g._t = t;
        g.addEventListener('click', function () { onClick(g._d); });
        g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onClick(g._d); } });
        nodeEls[key] = g;
        g.getBoundingClientRect(); // commit start position so the move animates
      }
      g._d = d;
      g.setAttribute('class', 'node' + (hasKids ? ' branch' : '') + (sel === key ? ' sel' : '') + (dimmed(d) ? ' dim' : '') + (query && match(d) ? ' hit' : ''));
      g.setAttribute('aria-label', d.data.name + (hasKids ? (d.children ? ', open' : ', closed') : ''));
      var c = g.firstChild;
      c.setAttribute('stroke', d.data.color);
      c.setAttribute('fill', d._children ? d.data.color : 'var(--surface)');
      var left = !!hasKids && d.depth > 0 && d.children;
      var t2 = g._t;
      t2.setAttribute('x', left ? -12 : 12);
      t2.setAttribute('text-anchor', left ? 'end' : 'start');
      var count = d._children ? ' (' + countLeaves(d) + ')' : '';
      t2.innerHTML = '';
      t2.appendChild(document.createTextNode(d.data.name));
      if (count) { var s = el('tspan', { 'class': 'n' }, t2); s.textContent = count; }
      g.style.transform = 'translate(' + d.y + 'px,' + d.x + 'px)';
    });
    Object.keys(nodeEls).forEach(function (k) { if (!live[k]) { gNodes.removeChild(nodeEls[k]); delete nodeEls[k]; } });
  }

  function countLeaves(d) { var n = 0; (d.children || d._children || []).forEach(function (c) { n += (c.children || c._children) ? countLeaves(c) + (c.data.page ? 1 : 0) : 1; }); return n; }
  function text(d) { var p = d.data.page || {}; return (d.data.name + ' ' + (p.title || '') + ' ' + (p.summary || '') + ' ' + (p.topics || []).join(' ')).toLowerCase(); }
  function match(d) { return text(d).indexOf(query) !== -1; }
  function dimmed(d) {
    if (!query) return false;
    var any = false;
    d.each(function (x) { if (match(x)) any = true; });
    (d._children || []).forEach(function (c) { if (!any) { var h = d3.hierarchy(c.data); h.each(function (x) { if (text(x).indexOf(query) !== -1) any = true; }); } });
    return !any;
  }

  function onClick(d) {
    sel = d.data.id;
    if (d.children) { d._children = d.children; d.children = null; }
    else if (d._children) { d.children = d._children; d._children = null; }
    show(d);
    render();
  }

  var card = document.getElementById('card');
  function show(d) {
    var p = d.data.page;
    if (!p) { card.classList.remove('on'); return; }
    document.getElementById('c-title').textContent = p.title.replace(/\s*\|\s*Andr[ée]s Blitz.*$/, '');
    document.getElementById('c-sum').textContent = esc(p.summary);
    document.getElementById('c-meta').textContent = [pathOf(p.url), p.lang, p.last_updated && ('updated ' + p.last_updated)].filter(Boolean).join(' · ');
    document.getElementById('c-go').href = pathOf(p.url);
    card.classList.add('on');
  }

  function init(pages) {
    var data = build(pages);
    root = d3.hierarchy(data);
    (root.children || []).forEach(collapse);
    gLinks = el('g', {}, svg); gNodes = el('g', {}, svg);
    document.getElementById('count').textContent = pages.length + ' pages';
    document.getElementById('legend').innerHTML = SECTIONS.map(function (s) { return '<span><i style="background:' + s.color + '"></i>' + s.name + '</span>'; }).join('');
    document.getElementById('c-x').onclick = function () { card.classList.remove('on'); sel = null; render(); };
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') card.classList.remove('on'); });
    document.getElementById('expand').onclick = function () { expand(root); render(); };
    document.getElementById('collapse').onclick = function () { (root.children || []).forEach(collapse); render(); };
    document.getElementById('q').addEventListener('input', function (e) {
      query = e.target.value.trim().toLowerCase();
      if (query) expand(root);
      render();
    });
    render();
  }

  fetch('/api/site.json').then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (j) { init(j.pages || []); })
    .catch(function () {
      document.getElementById('wrap').insertAdjacentHTML('afterbegin', '<p class="err">Could not load the page list. Try <a href="/sitemap.xml">sitemap.xml</a>.</p>');
    });
})();
</script>
