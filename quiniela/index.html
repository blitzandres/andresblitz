<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiniela 2026 | andresblitz.com</title>
<meta name="description" content="World Cup 2026 prediction pool — friends only.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Syne+Mono:wght@400&display=swap" rel="stylesheet">

</nav>

<main id="q-app"></main>

<!-- Firebase compat SDK — no build step needed -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
