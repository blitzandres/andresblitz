# Alerts worker. Separate from ../worker (andresblitz-ai-api), which is not changed.
name = "andresblitz-alerts"
main = "src/index.js"
compatibility_date = "2026-10-28"
account_id = "cdcaafde1bec82e4c4e20432a08191fd"
workers_dev = true

[vars]
SITE = "https://andresblitz.com"
WORKER_URL = "https://andresblitz-alerts.blitzandres.workers.dev"
ALLOWED_ORIGINS = "https://andresblitz.com,https://www.andresblitz.com"
FROM_EMAIL = "alertas@andresblitz.com"
FROM_NAME = "Andrés Blitz"

[triggers]
crons = ["*/30 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "andresblitz-alerts"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

# Cloudflare Email Service (sending). The domain must be onboarded for sending first.
[[send_email]]
name = "EMAIL"
